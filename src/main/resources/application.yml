server:
  port: 8080
  servlet:
    context-path: /sanasa-training-tracker

spring:
  application:
    name: sanasa-training-tracker

  datasource:
    url: jdbc:mysql://localhost:3306/sanasa_training_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo
    username: root
    password: root@1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  sql:
    init:
      mode: always

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
