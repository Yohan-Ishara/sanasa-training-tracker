server:
  port: ${PORT:8080}
  servlet:
    context-path: /sanasa-training-tracker

spring:
  application:
    name: sanasa-training-tracker

  datasource:
    url: jdbc:postgresql://postgres:ocIIVuYiNFrTJPaCWJUFElKQuoXSLfcf@postgres.railway.internal:5432/railway
    username: ${PGUSER:postgres}
    password: ${POSTGRES_PASSWORD:ocIIVuYiNFrTJPaCWJUFElKQuoXSLfcf}
    Driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
